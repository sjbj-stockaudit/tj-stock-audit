name: Deploy to Cloudflare

# Publishes the app to Cloudflare (free plan). Needs two repository secrets:
#   CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID  (see DEPLOY.md)
# Runs on every push to main, or manually from the Actions tab.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

      - name: Create the database (first run only) and link it
        run: |
          id=$(npx wrangler d1 list --json | jq -r '.[] | select(.name=="tj-stock-audit") | .uuid')
          if [ -z "$id" ]; then
            npx wrangler d1 create tj-stock-audit
            id=$(npx wrangler d1 list --json | jq -r '.[] | select(.name=="tj-stock-audit") | .uuid')
          fi
          sed -i "s/^database_id = .*/database_id = \"$id\"/" wrangler.toml
          echo "Database: $id"

      - name: Create the photo storage bucket (first run only)
        run: npx wrangler r2 bucket list | grep -q 'tj-stock-audit-photos' || npx wrangler r2 bucket create tj-stock-audit-photos

      - name: Apply database changes
        run: npx wrangler d1 migrations apply DB --remote

      - name: Create the Pages project (first run only)
        run: npx wrangler pages project list | grep -q 'tj-stock-audit' || npx wrangler pages project create tj-stock-audit --production-branch main

      - name: Publish
        run: npx wrangler pages deploy dist --project-name tj-stock-audit --branch main --commit-dirty=true
