name = "tj-stock-audit"
main = "server/worker.ts"
compatibility_date = "2025-10-01"

# The built web app (dist/) is served as static files; any unknown path falls back to
# index.html so the app's own pages work. Only /api/* runs the server code.
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "tj-stock-audit"
# Cloudflare D1 database (Asia-Pacific)
database_id = "927082cc-154f-4575-a534-3854d5c5d871"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "tj-stock-audit-photos"
